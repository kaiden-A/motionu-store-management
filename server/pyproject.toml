[project]
name = "pinpoint-server"
version = "0.1.0"
description = "PinPoint — event sales tracker backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
