<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f4f6;font-family:Arial,Helvetica,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f6;padding:24px 12px">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e5e5e8">
      <tr><td style="background:#1a1a2e;padding:22px 28px">
        <div style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:1px">MOTION-<span style="color:#a78bfa">U</span></div>
      </td></tr>
      <tr><td style="padding:28px">
        <h1 style="margin:0 0 16px;font-size:22px;color:#1a1a2e">{{ title }}</h1>
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:16px 28px;background:#fafafa;color:#999;font-size:12px;text-align:center">
        Motion-U &middot; You move, we deliver.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
